name: Release crates
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create GitHub Release"
        required: true
        default: true
        type: boolean

jobs:
  release:
    uses: mlm-games/ci/.github/workflows/crate-publish.yml@main
    with:
      auto-bump: ${{ github.event_name == 'workflow_dispatch' }}
      create-release: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_release) }}
      workspace-publish: true
      workspace-exclude: "showcase animation_demo android_counter"
      system-deps: "libwayland-dev libxkbcommon-dev libfontconfig-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev pkg-config"
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}