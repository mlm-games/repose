name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libfontconfig-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev pkg-config
      - name: Install Rust components
        run: rustup component add rustfmt clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace --all-targets --locked
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Run workspace tests
        run: cargo test --workspace --locked

  all-features:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libfontconfig-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libudev-dev pkg-config
      - name: Check all features
        run: cargo check --workspace --all-features --locked

  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install WASM target
        run: rustup target add wasm32-unknown-unknown
      - name: Install pinned web tools
        run: |
          cargo install trunk --version 0.21.14 --locked
          cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - name: Check showcase WASM target
        run: cargo check -p showcase --target wasm32-unknown-unknown --lib --locked
      - name: Build showcase production bundle
        working-directory: examples/showcase
        run: trunk build --release --locked
      - name: Verify showcase bundle
        run: test -s examples/showcase/dist/index.html

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-21-jdk adb
      - name: Install pinned Android SDK
        run: |
          ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.14206865"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "ANDROID_BUILD_TOOLS=35.0.0" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Install Android target and pinned tool
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-rapk --version 0.22.1 --locked
          cargo rapk version
          cargo fetch --locked
          echo "CARGO_NET_OFFLINE=true" >> "$GITHUB_ENV"
      - name: Check Android metadata
        run: |
          cargo rapk check -p showcase --target aarch64-linux-android --lib
          cargo rapk check -p android_counter --target aarch64-linux-android --lib
      - name: Build Android APKs
        run: |
          cargo rapk build -p showcase --target aarch64-linux-android --lib --deterministic --unsigned
          cargo rapk build -p android_counter --target aarch64-linux-android --lib --deterministic --unsigned
          apk="$(find target -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          printf '%s\n' "$apk"

  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libfontconfig-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev pkg-config
      - name: Verify publishable packages
        run: cargo package --workspace --exclude showcase --exclude animation_demo --exclude android_counter --locked
