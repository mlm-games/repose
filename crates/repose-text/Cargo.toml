[package]
name = "repose-text"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Text handling (parley + swash based font & layout engine)"

[features]
default = ["basic", "system-fonts"]
basic = ["font-awl/basic"]
system-fonts = ["font-awl/system"]
emoji = ["font-awl/emoji"]
cjk = ["font-awl/cjk"]
monospace = ["font-awl/monospace"]
local-fonts = ["font-awl/local-fonts"]
probe_no_system = []

[dependencies]
font-awl = { workspace = true }
log = { workspace = true }
parley = { workspace = true }
rapidhash = { workspace = true }
skrifa = { workspace = true }
swash = { workspace = true }
unicode-segmentation = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true }
js-sys = { workspace = true }
