[package]
name = "repose-text"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Text handling (parley + swash based font & layout engine)"

[features]
default = ["basic"]
basic = ["font-awl/basic"]
emoji = ["font-awl/emoji"]
cjk = ["font-awl/cjk"]
monospace = ["font-awl/monospace"]

[dependencies]
font-awl = { workspace = true }
log = { workspace = true }
once_cell = "1"
parley = { workspace = true }
rapidhash = { workspace = true }
skrifa = { workspace = true }
swash = { workspace = true }
unicode-segmentation = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = ["Window", "Navigator", "Request", "RequestInit", "RequestMode", "RequestCache", "Response", "Headers"] }
js-sys = "0.3"
