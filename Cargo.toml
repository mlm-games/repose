[workspace]
members = ["crates/*", "examples/*"]
resolver = "3"

[workspace.package]
version = "0.28.20"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/mlm-games/repose"
rust-version = "1.98"

# [patch.crates-io]
# font-awl = { path = "../font-awl" }

[workspace.dependencies]
anyhow = "1"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
smallvec = "1.15"
slotmap = "1.1"
unicode-segmentation = "1.13"
clipawl = { version = "0.4", default-features = false }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "Document",
  "Window",
  "Navigator",
  "Element",
  "HtmlElement",
  "HtmlCanvasElement",
  "CssStyleDeclaration",
  "Request",
  "RequestInit",
  "RequestMode",
  "RequestCache",
  "Response",
  "Headers",
  "DragEvent",
  "DataTransfer",
  "FileList",
  "File",
  "Location",
] }
js-sys = "0.3"
console_error_panic_hook = "0.1"
console_log = "1"
getrandom = "0.3"
bytemuck = { version = "1.25.0", features = ["derive"] }

taffy = "0.14"
winit = "0.30"
wgpu = { version = "30", features = ["webgl"] }
pollster = "1"

accesskit = "0.25"
accesskit_winit = "0.34"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
lyon_tessellation = "1.0"
lyon_path = "1.0"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
rlobkit-dialogs = "0.5.3"

font-awl = "0.2"
parley = { version = "0.11", default-features = false, features = ["std"] }
skrifa = "0.44"
swash = "0.2"

android_logger = "0.15"
web-time = "1"
web-workers = "0.3"
rustc-hash = "2.1"
rapidhash = "4.5"
webbrowser = "1.2"

repose-app = { path = "crates/repose-app", version = "0.28.20" }
repose-core = { path = "crates/repose-core", version = "0.28.20" }
repose-ui = { path = "crates/repose-ui", version = "0.28.20" }
repose-material = { path = "crates/repose-material", version = "0.28.20" }
repose-canvas = { path = "crates/repose-canvas", version = "0.28.20" }
repose-navigation = { path = "crates/repose-navigation", version = "0.28.20" }
repose-devtools = { path = "crates/repose-devtools", version = "0.28.20" }
repose-text = { path = "crates/repose-text", version = "0.28.20" }
repose-render-wgpu = { path = "crates/repose-render-wgpu", version = "0.28.20" }
repose-platform = { path = "crates/repose-platform", version = "0.28.20" }
repose-tree = { path = "crates/repose-tree", version = "0.28.20" }
repose-docking = { path = "crates/repose-docking", version = "0.28.20" }
repose-macros = { path = "crates/repose-macros", version = "0.28.20" }

# [patch.crates-io]
# repose-core = { path = "../repose/crates/repose-core" }
# font-awl = { path = "../font-awl" }

[profile.dev]
opt-level = 1

# [profile.release]
# lto = "thin"
