[workspace]
members = ["crates/*", "examples/*"]
resolver = "3"

[workspace.package]
version = "0.28.4"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/mlm-games/repose"
rust-version = "1.93"

# [patch.crates-io]
# font-awl = { path = "../font-awl" }

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
smallvec = "1.15"
slotmap = "1.1"
bitflags = "2.13"
unicode-segmentation = "1.13"
clipawl = { version = "0.4", default-features = false }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "Document",
  "Window",
  "Element",
  "HtmlElement",
  "HtmlCanvasElement",
  "CssStyleDeclaration",
] }

console_error_panic_hook = "0.1"
console_log = "1"
getrandom = "0.3"
bytemuck = { version = "1.25.0", features = ["derive"] }

taffy = { version = "0.12", default-features = true }

winit = { version = "0.30", default-features = true }
wgpu = { version = "30", features = ["webgl"] }
pollster = "0.4"

font-awl = "0.2"
parley = { version = "0.11", default-features = false, features = ["std"] }
skrifa = "0.44"
swash = "0.2"

android_logger = "0.15"
web-time = "1"
rustc-hash = "2.1"
rapidhash = "4.5"
webbrowser = "1.2"

repose-app = { path = "crates/repose-app", version = "0.28.4" }
repose-core = { path = "crates/repose-core", version = "0.28.4" }
repose-ui = { path = "crates/repose-ui", version = "0.28.4" }
repose-material = { path = "crates/repose-material", version = "0.28.4" }
repose-canvas = { path = "crates/repose-canvas", version = "0.28.4" }
repose-navigation = { path = "crates/repose-navigation", version = "0.28.4" }
repose-devtools = { path = "crates/repose-devtools", version = "0.28.4" }
repose-text = { path = "crates/repose-text", version = "0.28.4" }
repose-render-wgpu = { path = "crates/repose-render-wgpu", version = "0.28.4" }
repose-platform = { path = "crates/repose-platform", version = "0.28.4" }
repose-tree = { path = "crates/repose-tree", version = "0.28.4" }
repose-docking = { path = "crates/repose-docking", version = "0.28.4" }
repose-macros = { path = "crates/repose-macros", version = "0.28.4" }
