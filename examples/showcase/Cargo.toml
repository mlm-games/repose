[package]
name = "showcase"
version.workspace = true
edition.workspace = true
publish = false
default-run = "showcase-desktop"

[lib]
name = "showcase"
crate-type = ["cdylib", "rlib"]

[features]
default = []

[[bin]]
name = "showcase-desktop"
path = "src/main.rs"

[package.metadata.android]
package = "com.example.showcase"
apk_name = "showcase"
target_sdk_version = 34
min_sdk_version = 26
build_targets = ["aarch64-linux-android"]
split_per_abi = true

[package.metadata.android.application]
label = "Repose Showcase"
fullscreen = true

[target.'cfg(target_os = "android")'.dependencies]
android_logger = { workspace = true }

[target.'cfg(all(not(target_os = "android"), not(target_arch = "wasm32")))'.dependencies]

[dependencies]
repose-core.workspace = true
repose-ui.workspace = true
repose-material.workspace = true
repose-canvas.workspace = true
repose-navigation.workspace = true
repose-docking.workspace = true
repose-platform.workspace = true

winit = { workspace = true }
env_logger = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
web-time.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true }
winit = { workspace = true, features = ["rwh_05"] }
console_error_panic_hook = { workspace = true }
console_log = { workspace = true }
log.workspace = true
getrandom = { workspace = true, features = ["wasm_js"] }
wgpu = { workspace = true, features = ["webgpu", "webgl"] }
repose-platform.workspace = true
repose-render-wgpu.workspace = true
