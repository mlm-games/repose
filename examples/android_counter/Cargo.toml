[package]
name = "android_counter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Minimal Android counter built with Repose"
publish = false

[lib]
name = "android_counter"
crate-type = ["cdylib"]

[package.metadata.android]
package = "com.example.android_counter"
apk_name = "android_counter"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[package.metadata.android.application]
label = "Repose Counter"
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"

[dependencies]
repose-core.workspace = true
repose-ui.workspace = true
repose-platform.workspace = true
repose-material.workspace = true
winit = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
rlobkit-app-events = { workspace = true }
